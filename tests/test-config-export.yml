name: Test config save and export
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.32.1"
          access-key: "SCWXXXXXXXXXXXXXXXXX"
          secret-key: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          default-project-id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          default-organization-id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          save-config: "true"
          export-config: "true"
      - name: Assert scw is installed
        run: |
          which scw || { echo "FAIL: scw not found in PATH"; exit 1; }
          echo "PASS: scw is installed"
      - name: Assert config was saved
        run: |
          CONFIG_FILE="$HOME/.config/scw/config.yaml"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "PASS: config file exists"
      - name: Assert env vars exported
        run: |
          echo "SCW_ACCESS_KEY: $SCW_ACCESS_KEY"
          if [ -z "$SCW_ACCESS_KEY" ]; then
            echo "FAIL: SCW_ACCESS_KEY not exported"
            exit 1
          fi
          echo "PASS: environment variables exported"
