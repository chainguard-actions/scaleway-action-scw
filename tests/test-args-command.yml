name: Test args command execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.32.1"
          args: "version -o json"
      - name: Assert json output is non-empty
        env:
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          if [ -z "$JSON_OUTPUT" ]; then
            echo "FAIL: expected non-empty json output"
            exit 1
          fi
          # Verify it is valid JSON
          echo "$JSON_OUTPUT" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: output is not valid JSON"
            exit 1
          }
          echo "PASS"
