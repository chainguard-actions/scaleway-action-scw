name: Test args command execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.32.1"
          args: "version"
          access-key: "SCWXXXXXXXXXXXXXXXXX"
          secret-key: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          default-project-id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
          default-organization-id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      - name: Assert json output is set
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual json output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json output to be non-empty"
            exit 1
          fi
          echo "PASS: json output is non-empty"
