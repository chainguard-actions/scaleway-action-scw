name: Test running a CLI command with JSON output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2.32.1"
          args: "version"
      - name: Assert JSON output is set
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected json output to be non-empty"
            exit 1
          fi
          echo "PASS: json output is set"
      - name: Assert JSON output contains version info
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -qi "version\|Version\|2.32.1"; then
            echo "PASS: json output contains version information"
          else
            echo "FAIL: expected json output to contain version info"
            exit 1
          fi
